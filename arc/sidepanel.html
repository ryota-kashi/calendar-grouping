<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Calendar Grouping</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sp-root">

    <!-- ヘッダー -->
    <div class="sp-header">
      <div class="sp-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <div class="sp-header-text">
        <h1>Calendar Grouping</h1>
        <p class="sp-status" id="spStatus">読み込み中...</p>
      </div>
      <button id="refreshBtn" class="sp-icon-btn sp-refresh-btn" title="カレンダーを再取得">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>

    <!-- メインコンテンツ（スクロール可能） -->
    <div class="sp-content">

      <!-- 作成・編集フォーム -->
      <div id="groupForm" class="sp-form" style="display:none">
        <div class="sp-form-header">
          <span class="sp-form-title" id="formTitle">新しいグループを作成</span>
          <button id="formCancelBtn" class="sp-icon-btn" title="キャンセル">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
        <input type="text" id="formGroupName" class="sp-form-input" placeholder="グループ名を入力" />
        <label class="sp-form-label">カレンダーを選択</label>
        <div id="formCalList" class="sp-cal-list"></div>
        <div class="sp-form-btns">
          <button id="formSaveBtn" class="sp-btn-primary">保存</button>
          <button id="formCancelBtn2" class="sp-btn-secondary">キャンセル</button>
        </div>
      </div>

      <!-- グループ選択モード -->
      <div class="sp-mode-row">
        <span class="sp-mode-label">複数グループ同時ON</span>
        <label class="sp-toggle">
          <input type="checkbox" id="multiGroupToggle">
          <span class="sp-toggle-slider"></span>
        </label>
      </div>

      <!-- グループ一覧 -->
      <div class="sp-section">
        <div class="sp-section-header">
          <span class="sp-section-title">グループ一覧</span>
          <button id="createGroupBtn" class="sp-create-btn">
            <svg viewBox="0 0 20 20" fill="currentColor" width="11" height="11">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
            </svg>
            新規作成
          </button>
        </div>
        <div id="groupList" class="sp-group-list"></div>
      </div>

    </div>

    <!-- フッター -->
    <div class="sp-footer">
      <button id="clearCacheBtn" class="sp-text-btn">
        <svg viewBox="0 0 20 20" fill="currentColor" width="12" height="12">
          <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        キャッシュをクリア
      </button>
    </div>

  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
