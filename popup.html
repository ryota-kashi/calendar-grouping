<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カレンダーグループ管理</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div id="groupSection" style="display:none;">
    <h3>グループ一覧</h3>
    <div id="groupList"></div>
  </div>

  <div id="editGroupSection" style="display:none;">
    <h3>グループを編集</h3>
    <input type="text" id="editGroupNameInput" placeholder="グループ名を入力">
    <div id="editCalendarList"></div>
    <button id="updateGroupBtn">更新</button>
    <button id="cancelEditBtn">キャンセル</button>
  </div>

  <div id="createGroupSection">
    <h3>新しいグループを作成</h3>
    <input type="text" id="groupNameInput" placeholder="グループ名を入力">
    <div id="calendarList"></div>
    <button id="addGroupBtn">グループを作成</button>
  </div>

  <div id="cacheSection">
    <h3>設定</h3>
    <button id="clearCacheBtn" class="settings-btn">
      <span class="material-icons">clear_all</span>
      カレンダーキャッシュをクリア
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
