<h2>2つ目のグループをクリックしたとき</h2>
<p class="subtitle">グループ1がONの状態でグループ2をクリックすると？</p>

<div class="cards">
  <div class="card" data-choice="additive" onclick="toggleSelect(this)">
    <div class="card-body">
      <div class="card-image" style="padding:16px;background:#f8f9fa;border-radius:8px;margin-bottom:12px;font-size:13px;">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div style="flex:1">
            <div style="font-size:11px;color:#666;margin-bottom:6px">クリック前</div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;"><input type="checkbox" checked style="accent-color:#1a73e8"><span>グループ1 ✓</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;color:#aaa"><input type="checkbox"><span>グループ2</span></div>
          </div>
          <div style="font-size:18px;color:#666;margin-top:16px">→</div>
          <div style="flex:1">
            <div style="font-size:11px;color:#666;margin-bottom:6px">クリック後</div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;"><input type="checkbox" checked style="accent-color:#1a73e8"><span style="color:#1a73e8">グループ1 ✓</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;"><input type="checkbox" checked style="accent-color:#e91e63"><span style="color:#e91e63">グループ2 ✓</span></div>
          </div>
        </div>
        <div style="margin-top:10px;padding:8px;background:#e8f5e9;border-radius:6px;font-size:12px;color:#2e7d32">
          ✓ A B C D が表示（E F は非表示）
        </div>
      </div>
      <h3>A: 追加（両方ON）</h3>
      <p>クリックするたびにグループが追加される。グループ1はそのまま残る</p>
    </div>
  </div>

  <div class="card" data-choice="replace" onclick="toggleSelect(this)">
    <div class="card-body">
      <div class="card-image" style="padding:16px;background:#f8f9fa;border-radius:8px;margin-bottom:12px;font-size:13px;">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div style="flex:1">
            <div style="font-size:11px;color:#666;margin-bottom:6px">クリック前</div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;"><input type="checkbox" checked style="accent-color:#1a73e8"><span>グループ1 ✓</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;color:#aaa"><input type="checkbox"><span>グループ2</span></div>
          </div>
          <div style="font-size:18px;color:#666;margin-top:16px">→</div>
          <div style="flex:1">
            <div style="font-size:11px;color:#666;margin-bottom:6px">クリック後</div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;color:#aaa"><input type="checkbox"><span>グループ1</span></div>
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;"><input type="checkbox" checked style="accent-color:#e91e63"><span style="color:#e91e63">グループ2 ✓</span></div>
          </div>
        </div>
        <div style="margin-top:10px;padding:8px;background:#fff3e0;border-radius:6px;font-size:12px;color:#e65100">
          ✓ C D のみ表示（A B は非表示）
        </div>
      </div>
      <h3>B: 切り替え（グループ1がOFFになる）</h3>
      <p>現在の動作と同じ。1グループのみが常にアクティブ</p>
    </div>
  </div>
</div>
