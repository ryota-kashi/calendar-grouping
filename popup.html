<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カレンダーグループ管理</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="header-icon">
      <span class="material-icons">layers</span>
    </div>
    <h1>カレンダーグループ</h1>
  </header>

  <!-- グループ一覧 -->
  <div id="groupSection" style="display:none;" class="section">
    <div class="section-title">グループ一覧</div>
    <div id="groupList"></div>
  </div>

  <!-- グループ編集 -->
  <div id="editGroupSection" style="display:none;" class="section form-section">
    <div class="section-title">グループを編集</div>
    <div class="form-group">
      <label class="form-label">グループ名</label>
      <input type="text" id="editGroupNameInput" placeholder="グループ名を入力">
    </div>
    <div class="form-group">
      <label class="form-label">カレンダー</label>
      <div class="calendar-scroll" id="editCalendarList"></div>
    </div>
    <div class="btn-row">
      <button id="updateGroupBtn" class="btn btn-primary">
        <span class="material-icons">check</span>更新
      </button>
      <button id="cancelEditBtn" class="btn btn-secondary">キャンセル</button>
    </div>
  </div>

  <!-- グループ作成 -->
  <div id="createGroupSection" class="section form-section">
    <div class="section-title">新しいグループを作成</div>
    <div class="form-group">
      <label class="form-label">グループ名</label>
      <input type="text" id="groupNameInput" placeholder="例: 採用チーム">
    </div>
    <div class="form-group">
      <label class="form-label">カレンダーを選択</label>
      <div class="calendar-scroll" id="calendarList"></div>
    </div>
    <button id="addGroupBtn" class="btn btn-primary">
      <span class="material-icons">add</span>グループを作成
    </button>
  </div>

  <!-- 設定 -->
  <div id="cacheSection">
    <button id="clearCacheBtn" class="settings-btn">
      <span class="material-icons">delete_sweep</span>
      カレンダーキャッシュをクリア
    </button>
  </div>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
