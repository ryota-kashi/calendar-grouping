<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Calendar Grouping</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <div class="header">
      <div class="logo-wrap">
        <span class="material-icons">layers</span>
      </div>
      <div class="header-text">
        <h1>Calendar Grouping</h1>
        <div class="tagline">Google Calendar 拡張機能</div>
      </div>
    </div>

    <div class="info-card">
      <span class="material-icons info-icon">tips_and_updates</span>
      <p>グループの管理・切り替えは、Googleカレンダーの<strong>サイドバー</strong>から直接できます。</p>
    </div>

    <button id="openCalendarBtn" class="btn-open">
      <span class="material-icons">open_in_new</span>
      Googleカレンダーを開く
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
